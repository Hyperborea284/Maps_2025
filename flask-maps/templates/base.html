<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>{{ title or "Flask Maps" }}</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, 'Helvetica Neue', Arial, sans-serif; margin: 0; padding: 0; }
    header { background: #0a3d62; color: #fff; padding: 12px 20px; }
    main { padding: 20px; max-width: 1100px; margin: 0 auto; }
    a { color: #0a3d62; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .container { margin-top: 10px; }
  </style>
</head>
<body>
  <header>
    <h1 style="margin:0;">Flask Maps – Brasil</h1>
  </header>
  <main class="container">
    {% block content %}
      {{ content|safe }}
    {% endblock %}
  </main>
</body>
</html>
